<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a3d" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Static fallback meta tags for non-JS crawlers/social previews.
         Each route overrides these client-side via @vueuse/head (see src/composables/usePageSeo.js).
         NOTE: because this is a client-rendered SPA, crawlers that don't execute JavaScript
         will only see this fallback content, not the per-route content. For full SEO indexing
         of the per-page titles/descriptions, consider adding prerendering/SSR (see docs/SEO-NEXT-STEPS.md). -->
    <title>Masterji Consultancy | Tour & Travel, Solar, Interior Design, Touring</title>
    <meta name="description" content="Masterji Consultancy offers travel, solar, interior design, touring, and scrap collection services." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.masterjiconsultancy.com/" />
    <meta property="og:site_name" content="Masterji Consultancy" />
    <meta property="og:title" content="Masterji Consultancy" />
    <meta property="og:description" content="Travel, solar, interior design, touring, and scrap collection services." />
    <meta property="og:image" content="https://www.masterjiconsultancy.com/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- TODO: add your Google Search Console verification meta tag here once you have one, e.g.
         <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
